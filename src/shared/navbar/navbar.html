<p-menubar [model]="items" styleClass="custom-menubar">
    <ng-template #start>
        <div class="navbar-brand" routerLink="/">
            <div class="brand-icon">🌿</div>
            <div class="brand-text">
                <span class="brand-name">Pronathom®</span>
                <span class="brand-tagline">Productos Naturales</span>
            </div>
        </div>
    </ng-template>

    <ng-template #item let-item let-root="root">
        <a pRipple class="flex items-center p-menubar-item-link" [class.active-menu-item]="isActive(item.route)">
            <i *ngIf="item.icon" [class]="item.icon" class="menu-icon"></i>
            <span class="menu-label">{{ item.label }}</span>
            <i *ngIf="item.items" [ngClass]="['ml-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
        </a>
    </ng-template>

    <ng-template #end>
        <div class="navbar-end">
            <a routerLink="/contacto" class="contact-button">
                <i class="pi pi-phone"></i>
                <span>Contacto</span>
            </a>
        </div>
    </ng-template>
</p-menubar>
