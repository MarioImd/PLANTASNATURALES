<p-menubar [model]="items" styleClass="custom-menubar">
    <ng-template #start>
        <div class="navbar-brand" routerLink="/">
            <div class="brand-icon">🌿</div>
            <div class="brand-text">
                <span class="brand-name">Pronathom®</span>
                <span class="brand-tagline">Productos Naturales</span>
            </div>
        </div>
    </ng-template>

    <ng-template #item let-item let-root="root">
        <a pRipple class="flex items-center p-menubar-item-link" [class.active-menu-item]="isActive(item.route)">
            <i *ngIf="item.icon" [class]="item.icon" class="menu-icon"></i>
            <span class="menu-label">{{ item.label }}</span>
            <i *ngIf="item.items" [ngClass]="['ml-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
        </a>
    </ng-template>

    <ng-template #end>
        <div class="navbar-end d-flex align-items-center gap-3">
            <!-- Dark Mode Toggle -->
            <button class="theme-toggle-button" (click)="toggleTheme()"
                [attr.aria-label]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
                title="{{isDarkMode ? 'Modo claro' : 'Modo oscuro'}}">
                <i *ngIf="!isDarkMode" class="pi pi-moon"></i>
                <i *ngIf="isDarkMode" class="pi pi-sun"></i>
            </button>

            <!-- Botón de contacto -->
            <a routerLink="/contacto" class="contact-button">
                <i class="pi pi-phone"></i>
                <span>Contacto</span>
            </a>

            <!-- Sección de usuario/autenticación -->
            <ng-container *ngIf="currentUser; else loginButton">
                <!-- Avatar y nombre del usuario -->


                <!-- Dropdown de usuario -->
                <div class="dropdown">

                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">

                        <li>
                            <a class="dropdown-item text-danger" class="contact-button" (click)="logout()">
                                <i class="pi pi-sign-out me-2"></i>Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </div>
            </ng-container>

            <ng-template #loginButton>
            
            </ng-template>
        </div>
    </ng-template>
</p-menubar>
